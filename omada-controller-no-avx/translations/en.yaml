---
configuration:
  enable_hass_ssl:
    name: Enable Home Assistant SSL
    description: Use Home Assistant SSL certificates for the Omada Controller
  certfile:
    name: Certificate file
    description: Path to SSL certificate file relative to /ssl directory
  keyfile:
    name: Private key file
    description: Path to SSL private key file relative to /ssl directory
  enable_workaround_509:
    name: Legacy 509 workaround
    description: Obsolete compatibility option retained for existing configurations; it has no effect on Omada 6.3
